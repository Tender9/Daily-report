[project]
name = "qunliao-ribao-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "llama-cpp-python>=0.2.80",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0"
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[[tool.uv.index]]
name = "llama-cpp-whl"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
